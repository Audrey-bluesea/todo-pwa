<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 铁律：严禁缩放 + 安全区适配 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F6FAF6" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="行时录 · 清新淡雅的待办与日历 PWA" />

    <!-- iOS 全屏 Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 状态栏样式：保持 black-translucent。
         实测（真机逐像素）：iOS 27 即便用 default，状态栏仍是玻璃材质，仍会对状态栏
         下方约 35pt 的网页内容做渐进模糊；而 black-translucent 下状态栏文字是深色、
         底色沿用页面背景，观感更好，且底部安全区(--sab=34)是已验证可用的状态。
         顶部模糊改用「柔光渐变 + 文字下移」规避（见 index.css 的 html.glasstop）。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="行时录" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>行时录</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
