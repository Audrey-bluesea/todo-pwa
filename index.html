<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 铁律：严禁缩放 + 安全区适配 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F6FAF6" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="行时录 · 清新淡雅的待办与日历 PWA" />

    <!-- iOS 全屏 Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 状态栏样式：iOS 27 下 black-translucent 会让系统对状态栏下方约 35pt 的网页内容
         做「渐进模糊」（Liquid Glass 材质外渗），顶部文字发虚。
         改成 default 让状态栏不透明、网页内容不再被材质采样。
         安全区仍走 env()：若系统把网页区域内缩，--sat/--sab 会自动变 0，布局自适应。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="行时录" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>行时录</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
