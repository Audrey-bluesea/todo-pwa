<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 铁律：严禁缩放 + 安全区适配 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F6FAF6" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="行时录 · 清新淡雅的待办与日历 PWA" />

    <!-- iOS 全屏 Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 状态栏样式：必须是 default（不要改回 black-translucent）。
         【真机实测 iPhone 18 Pro Max / iOS 27，440x956】
         · black-translucent：env 值是对的（sat 62 / sab 34），但网页坐标系只有 894 高
           （= 956 − 62），屏幕最下 62pt 根本不属于网页 → TabBar / FAB 只能悬在半空，
           底部露出 62pt 空白，内容区也矮 62pt。
         · default：网页铺满整块屏（innerHeight == screen.height == 956），
           底部问题彻底解决；但 WebKit 把 env(safe-area-inset-top/bottom) 都报成 0，
           状态栏与 Home 指示条仍压在页面上。
         所以：default + 由 main.tsx 用探针判定后加 .ios-pwa，在 CSS 里用 max() 自补
         62 / 34 两个安全区（详见 src/index.css 与 main.tsx 的说明）。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="行时录" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>行时录</title>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
